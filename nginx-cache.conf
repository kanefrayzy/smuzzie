# ─── Add this block inside your Nginx server {} block for smuzzie.com ───
# It should go BEFORE the general proxy_pass to Next.js

# Proxy /storage/ to Laravel backend with aggressive caching
# Files have UUID names and never change — safe to cache for 1 year
location /storage/ {
    proxy_pass http://127.0.0.1:8000;  # or your Laravel backend address
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache headers for browsers
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Nginx proxy cache (optional but recommended for large GIFs)
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 1m;

    # Allow large files (GIFs up to 50MB)
    proxy_max_temp_file_size 50m;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

# ─── OR if storage is served directly from disk (symlinked): ───
