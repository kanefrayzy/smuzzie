; Queue worker for the banner builder (template processing + renders).
; One process = one render at a time, so PHP-FPM and Next.js keep enough CPU.
; Install: cp to /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update
[program:smuzzie-banners-worker]
command=/usr/bin/nice -n 10 /usr/bin/php /var/www/smuzzie/backend/artisan queue:work banners --queue=banners --sleep=3 --tries=2 --timeout=900 --max-time=3600 --memory=256
directory=/var/www/smuzzie/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
; let a running job finish on restart (render 600 s, template processing 840 s)
stopwaitsecs=900
stopasgroup=true
killasgroup=true
environment=HOME="/var/www",PLAYWRIGHT_BROWSERS_PATH="/opt/ms-playwright"
stdout_logfile=/var/www/smuzzie/backend/storage/logs/banners-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
